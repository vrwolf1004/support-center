<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Center</title>
    <!-- 테마 토큰 + 스타일 -->
    <link rel="stylesheet" href="theme/artnouveau.css">
    <link rel="stylesheet" href="theme/style.css">
    <!-- Marked.js 라이브러리 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <nav id="nav">
        <div class="nav-inner">
            <h3><a href="#" id="logo">Support Center</a></h3>
            <div id="lang-switcher">
                <button class="lang-btn" data-lang="ko">한국어</button>
                <button class="lang-btn active" data-lang="en">English</button>
            </div>
            <button id="menu-toggle" class="menu-toggle">☰</button>
            <ul id="nav-list"></ul>
        </div>
    </nav>
    <div id="mobile-menu" class="mobile-menu">
        <ul id="mobile-nav-list"></ul>
    </div>
    <main>
        <div id="content">Loading...</div>
    </main>

    <script>
        const i18nMessages = {
            ko: {
                loadFail: '문서 목록을 불러오지 못했습니다.',
                docFail: '문서를 불러오지 못했습니다.',
                extensions: '프로그램 목록'
            },
            en: {
                loadFail: 'Failed to load page list.',
                docFail: 'Failed to load document.',
                extensions: 'Extensions'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'en';
        let currentPath = null;

        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');

        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
        });

        function closeMobileMenu() {
            mobileMenu.classList.remove('active');
        }

        function closeDropdown() {
            document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
        }

        // 드롭다운 외부 클릭 시 닫기
        document.addEventListener('click', () => closeDropdown());

        document.getElementById('logo').addEventListener('click', (e) => {
            e.preventDefault();
            const homePath = currentLang === 'en' ? 'README.en.md' : 'README.md';
            navigateTo(homePath, true);
            setActiveNav(homePath);
            closeMobileMenu();
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const newLang = btn.dataset.lang;
                if (currentLang === newLang) return;

                currentLang = newLang;
                localStorage.setItem('lang', currentLang);
                updateLangUI();
                await loadPages();

                if (currentPath) {
                    let newPath = currentPath;
                    if (currentPath.endsWith('.en.md')) {
                        newPath = currentPath.replace('.en.md', '.md');
                    } else if (currentPath.endsWith('.md')) {
                        newPath = currentPath.replace('.md', '.en.md');
                    }
                    navigateTo(newPath, false);
                    setActiveNav(newPath);
                }
            });
        });

        function updateLangUI() {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
        }

        async function loadPages() {
            try {
                const res = await fetch(`pages.${currentLang}.json`);
                const pages = await res.json();
                const list = document.getElementById('nav-list');
                const mobileList = document.getElementById('mobile-nav-list');
                list.innerHTML = '';
                mobileList.innerHTML = '';

                const extItems = [];
                const extLabel = (i18nMessages[currentLang].extensions || 'Extensions') + ' ▾';

                function makeAnchor(p) {
                    const a = document.createElement('a');
                    a.textContent = p.title;
                    a.dataset.path = p.path;
                    if (p.path.startsWith('http://') || p.path.startsWith('https://') || p.path.endsWith('.html')) {
                        a.href = p.path;
                        if (p.path.startsWith('http://') || p.path.startsWith('https://')) {
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                        }
                    } else {
                        a.href = '#' + encodeURIComponent(p.path);
                    }
                    return a;
                }

                pages.forEach(p => {
                    // 모바일: 항상 flat list
                    const mobileLi = document.createElement('li');
                    const mobileA = makeAnchor(p);
                    if (!p.path.endsWith('.html') && !p.path.startsWith('http')) {
                        mobileA.addEventListener('click', (ev) => {
                            ev.preventDefault();
                            navigateTo(p.path, true);
                            setActiveNav(p.path);
                            closeMobileMenu();
                        });
                    }
                    mobileLi.appendChild(mobileA);
                    mobileList.appendChild(mobileLi);

                    // 데스크톱: docs/*.md 항목은 드롭다운으로, 나머지는 직접 추가
                    const isExtItem = p.path.startsWith('docs/') && p.path.endsWith('.md');
                    if (isExtItem) {
                        extItems.push(p);
                    } else {
                        const li = document.createElement('li');
                        const a = makeAnchor(p);
                        if (!p.path.endsWith('.html') && !p.path.startsWith('http')) {
                            a.addEventListener('click', (ev) => {
                                ev.preventDefault();
                                navigateTo(p.path, true);
                                setActiveNav(p.path);
                            });
                        }
                        li.appendChild(a);
                        list.appendChild(li);
                    }
                });

                // 드롭다운 삽입: 마지막 standalone 항목(Privacy) 앞에
                if (extItems.length > 0) {
                    const dropdownLi = document.createElement('li');
                    dropdownLi.className = 'nav-dropdown';

                    const dropBtn = document.createElement('button');
                    dropBtn.className = 'nav-dropdown-btn';
                    dropBtn.id = 'extensionsDropBtn';
                    dropBtn.textContent = extLabel;

                    const dropMenu = document.createElement('ul');
                    dropMenu.className = 'nav-dropdown-menu';

                    extItems.forEach(p => {
                        const li = document.createElement('li');
                        const a = makeAnchor(p);
                        a.addEventListener('click', (ev) => {
                            ev.preventDefault();
                            navigateTo(p.path, true);
                            setActiveNav(p.path);
                            closeDropdown();
                        });
                        li.appendChild(a);
                        dropMenu.appendChild(li);
                    });

                    dropdownLi.appendChild(dropBtn);
                    dropdownLi.appendChild(dropMenu);
                    list.insertBefore(dropdownLi, list.lastChild);

                    dropBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        dropdownLi.classList.toggle('open');
                    });
                }

                const initial = location.hash ? decodeURIComponent(location.hash.slice(1)) : `README${currentLang === 'en' ? '.en' : ''}.md`;
                navigateTo(initial, false);
                setActiveNav(initial);
            } catch (err) {
                console.error('Failed to load pages json', err);
                document.getElementById('content').textContent = i18nMessages[currentLang].loadFail;
            }
        }

        function setActiveNav(path) {
            document.querySelectorAll('#nav-list a, #mobile-nav-list a').forEach(a => {
                a.classList.toggle('active', a.dataset.path === path);
            });
            const dropBtn = document.getElementById('extensionsDropBtn');
            if (dropBtn) {
                const isExtActive = !!document.querySelector('.nav-dropdown-menu a.active');
                dropBtn.classList.toggle('has-active', isExtActive);
            }
        }

        async function navigateTo(path, push) {
            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error(`Failed to fetch ${path}: ${res.status}`);
                const md = await res.text();
                document.getElementById('content').innerHTML = marked.parse(md);
                currentPath = path;
                if (push) history.pushState({path}, '', '#' + encodeURIComponent(path));
            } catch (err) {
                console.error(err);
                document.getElementById('content').textContent = i18nMessages[currentLang].docFail;
            }
        }

        window.addEventListener('popstate', (e) => {
            const path = (e.state && e.state.path) || (location.hash ? decodeURIComponent(location.hash.slice(1)) : 'README.md');
            navigateTo(path, false);
            setActiveNav(path);
        });

        loadPages();
    </script>

    <!-- Ko-fi 후원 위젯 -->
    <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
    <script>
        kofiWidgetOverlay.draw('dev_ohyt', {
            'type': 'floating-chat',
            'floating-chat.donateButton.text': 'Support me',
            'floating-chat.donateButton.background-color': '#00b9fe',
            'floating-chat.donateButton.text-color': '#fff'
        });
    </script>
</body>
</html>
